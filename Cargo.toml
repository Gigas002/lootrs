[workspace]
members = ["liblootrs", "lootrs"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
homepage = "https://github.com/Gigas002/lootrs"
description = "Minimal TUI and CLI for running Windows games through wine, Proton (umu) or natively"
keywords = ["wine", "proton", "umu", "tui", "games"]
repository = "https://github.com/Gigas002/lootrs"
version = "0.1.0"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.27"
thiserror = "2.0"
rustix = { version = "1.1", features = ["fs", "process"] }
toml = "1.1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "fmt",
  "registry",
  "std",
] }
