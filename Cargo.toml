[workspace]
members = ["liblootrs", "lootrs"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
description = "Minimal TUI and CLI for running Windows games through wine, Proton (umu) or natively"
keywords = ["wine", "proton", "umu", "tui", "games"]
repository = "https://github.com/Gigas002/lootrs"
version = "0.1.0"

[workspace.dependencies]
# Profiles (`profiles/*.toml`): the format lootrs, gaki and sruman share.
libgameprofiles = { git = "https://github.com/Gigas002/libgameprofiles", branch = "master", version = "0.1.0" }
# Local time for run-log stamps and headers.
jiff = "1"
clap = { version = "4", features = ["derive"] }
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
rustix = { version = "1", features = ["fs", "process"] }
toml = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "registry",
    "std",
] }
